<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen2.5-0.5B DPO Alignment Lab</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #0284c7 100%);
      padding: 14px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .topbar-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .topbar-meta {
      font-size: 0.85rem;
      color: #e0f2fe;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .topbar-meta a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
    }

    .topbar-meta a:hover {
      color: #bae6fd;
    }

    .frame-container {
      flex: 1;
      width: 100%;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title">Qwen2.5-0.5B Preference Alignment Lab (DPO: β = 0.1 vs β = 0.5)</h1>
    <div class="topbar-meta">
      <span>Dataset: <code>trl-lib/ultrafeedback_binarized</code></span>
      <a href="https://huggingface.co/spaces/Ahm-d18/TASK-ALIGNMENT-10" target="_blank" rel="noopener noreferrer">
        Open Full Space ↗
      </a>
    </div>
  </header>

  <main class="frame-container">
    <iframe
      src="https://ahm-d18-task-alignment-10.hf.space"
      title="Qwen2.5-0.5B DPO Alignment Gradio App"
      allow="accelerometer; ambient-light-sensor; autoplay; battery; camera; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; magnetometer; microphone; midi; payment; picture-in-picture; xr-spatial-tracking"
      loading="lazy"
    ></iframe>
  </main>
</body>
</html>
